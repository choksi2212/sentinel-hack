# CI — TRINETRA
#
# The lane-scoped pipeline from docs/REPOSITORY.md §14. That spec defines four
# jobs — contracts, backend, frontend, data — a cross-lane net plus one gate per
# lane, each path-filtered so a frontend PR never waits on backend tests.
#
# This repository carries the AI, frontend and data lanes, so this file ships
# four jobs:
#
#   contracts  the cross-lane safety net (§14.1's "runs on everything"): the
#              fixtures every lane encodes against must still satisfy the schemas.
#   ai         the AI lane's own gate — peer of §14's backend / frontend / data —
#              the full worker suite plus the repo-wide guard.
#   frontend   the dashboard gate: the honesty guard, then the real TypeScript
#              build. Path-filtered, so an AI-only PR never waits on npm.
#   data       the data lane's gate: manifests and the leakage check.
#
# backend joins verbatim from §14 when that lane lands; it is kept out until then
# on purpose. backend/ does not exist yet, and a gate that is red from birth is
# one people quickly learn to ignore.
#
# Dependencies: requirements.txt is the backend lane's single pinned environment
# (§5.1) and is not present yet, so these jobs install the AI lane's documented
# runtime set directly (see ai/README.md → "Core" + "Tracking"). That list
# collapses to `pip install -r requirements.txt` once the backend lane owns it.
# The heavy model backends (torch, cv2, onnxruntime, paddleocr, transformers)
# are lazily imported and exercised through scripted fakes and oracles, so the
# suite needs none of them installed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    # The cross-lane safety net (§14.1): runs on every PR, no path filter, so a
    # change in any lane that breaks a shared fixture is caught here first.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract-test dependencies
        run: pip install numpy PyYAML requests Pillow scipy pytest
      - name: Contract fixtures vs schemas
        run: python -m pytest tests/test_contracts.py -q

  ai:
    # The AI lane's gate: the full worker suite, which includes the repo-wide
    # guard in tests/test_no_attribution.py — no authorship marker and no access
    # token may appear in any tracked file. `git ls-files` (what the guard walks)
    # is exactly what actions/checkout lays down, so the guard runs unchanged.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AI worker dependencies
        run: pip install numpy PyYAML requests Pillow scipy pytest
      - name: Full worker suite + repo-wide guard
        run: python -m pytest -q

  frontend:
    # The dashboard gate. `npm run build` runs scripts/guard.mjs before it will
    # compile, so a build that passes here is also a build in which no upstream
    # host, credential-shaped VITE_ variable or non-canonical field name reached
    # the bundle. `npm run guard` runs first and separately so a guard failure is
    # labelled as a guard failure rather than surfacing as a TypeScript error.
    #
    # No backend and no network: the dashboard builds against its own types and
    # its mock service worker, and it must keep doing so — a build that silently
    # starts requiring a live API would strand every clone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Honesty guard
        working-directory: frontend
        run: npm run guard
      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  data:
    # The data lane's gate: the manifest and split rules every accuracy claim
    # rests on, plus the leakage check that keeps a test frame out of training.
    # Accuracy numbers are only as good as the split they were measured on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install data dependencies
        run: pip install numpy PyYAML requests Pillow scipy pytest
      - name: Split leakage check
        run: python scripts/check_split_leakage.py
